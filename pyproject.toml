[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rageval"
version = "0.1.0"
description = "Framework-agnostic RAG evaluation library — fully local, no LLM API required"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Pratham Jain", email = "prathamjain340@gmail.com"}
]
keywords = ["rag", "evaluation", "llm", "retrieval", "nlp", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sentence-transformers==2.7.0",
    "torch==2.3.0",
    "transformers==4.41.0",
    "bert-score==0.3.13",
    "numpy==1.26.4",
    "rich==13.7.1",
]

[project.urls]
Homepage = "https://github.com/prathamjain340/Lupa"
Repository = "https://github.com/prathamjain340/Lupa"
Documentation = "https://github.com/prathamjain340/Lupa/blob/main/docs/quickstart.md"
"Bug Tracker" = "https://github.com/prathamjain340/Lupa/issues"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rageval*"]
